<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Art Customizer Storefront</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Home Decor Wall Art Canvas And Framing Customizer Storefront
</h1>
        <nav>
            <a href="#shop">Shop</a>
            <a href="#customizer" class="active">Customizer</a>
            <a href="#cart">Cart (0)</a>
        </nav>
    </header>

    <!-- Main Studio Layout -->
    <main class="studio-layout">
        
        <!-- Left Column: Visual Preview Area -->
        <section class="preview-area">
            <div class="canvas-preview-box" id="preview-box">
                <img id="preview-img" src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80" alt="Your Wall Art">
            </div>
        </section>

        <!-- Right Column: Customization Controls Panel -->
        <aside class="control-panel">
            <h2>Customize Your Art</h2>
            <div id="controls-container">
                <p>Upload options and sizing will appear here.</p>
            </div>
        </aside>

    </main>

    <script src="script.js"></script>
</body>
</html>
